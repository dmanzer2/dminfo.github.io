<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found (404) — David Manzer</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
    :root { color-scheme: light dark; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
      display: grid;
      place-items: center;
      background: #0f1115;
      color: #e8eaf0;
    }
    .card {
      max-width: 640px; width: 92%;
      background: #141824;
      border: 1px solid #293245;
      border-radius: 12px;
      padding: 28px 24px;
      box-shadow: 0 6px 30px rgba(0,0,0,.25);
    }
    h1 { font-size: clamp(1.5rem, 2.5vw, 2rem); margin: 0 0 .25rem; }
    p { line-height: 1.6; margin: .5rem 0; color: #b9c0d4; }
    code { background: #0f1422; padding: 2px 6px; border-radius: 6px; }
    .actions { margin-top: 18px; display: flex; gap: 12px; flex-wrap: wrap; }
    a.btn { display: inline-block; padding: 10px 14px; border-radius: 10px; text-decoration: none; font-weight: 600; }
    a.primary { background: #3b82f6; color: white; }
    a.secondary { background: #232a3b; color: #d8def0; border: 1px solid #2f3950; }
    .small { font-size: .9rem; opacity: .8; }
  </style>
</head>
<body>
  <main class="card" role="main" aria-labelledby="title">
    <h1 id="title">404 — That page can’t be found</h1>
    <p>The URL you tried doesn’t exist or has moved.
      If you followed a link here, it may be outdated. You can head back to the homepage or explore my portfolio.</p>
    <p class="small">Requested path: <code id="path"></code></p>
    <div class="actions">
      <a class="btn primary" href="/">Go to Homepage</a>
      <a class="btn secondary" href="/#work">View Portfolio</a>
      <a class="btn secondary" href="/#contact">Contact Me</a>
    </div>
  </main>
  <script>
    // Show the requested path for context
    document.getElementById('path').textContent = location.pathname + location.search;
  </script>
</body>
</html>
